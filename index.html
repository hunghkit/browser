<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zen Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="browser-container">
    <!-- Tab Bar -->
    <div class="tab-bar">
      <div id="tabs-container" class="tabs-container"></div>
      <button id="new-tab-btn" class="new-tab-btn" title="New Tab">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 3V13M3 8H13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Browser Controls Bar -->
    <div class="toolbar">
      <div class="nav-buttons">
        <button id="back-btn" class="nav-btn" title="Back" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="forward-btn" class="nav-btn" title="Forward" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="reload-btn" class="nav-btn" title="Reload">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 8C2 10.2091 3.79086 12 6 12C7.10457 12 8.08024 11.4456 8.70711 10.7071M14 8C14 5.79086 12.2091 4 10 4C8.89543 4 7.91976 4.55439 7.29289 5.29289M7.29289 5.29289L10 8M7.29289 5.29289L5.29289 3.29289M8.70711 10.7071L11 8M8.70711 10.7071L10.7071 12.7071" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="url-container">
        <input type="text" id="url-bar" class="url-bar" placeholder="Enter URL or search..." />
      </div>

      <div class="action-buttons">
        <div class="proxy-selector-container">
          <select id="proxy-selector" class="proxy-selector" title="Select Proxy for Current Tab">
            <option value="">No Proxy</option>
          </select>
        </div>
        <button id="settings-btn" class="action-btn" title="Proxy Settings">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 10C9.10457 10 10 9.10457 10 8C10 6.89543 9.10457 6 8 6C6.89543 6 6 6.89543 6 8C6 9.10457 6.89543 10 8 10Z" stroke="currentColor" stroke-width="2"/>
            <path d="M12.5 8C12.5 8.5 12.6 8.9 12.7 9.3L13.5 9.5C13.8 9.6 13.9 9.9 13.8 10.2L13.2 11.3C13.1 11.6 12.8 11.7 12.5 11.6L11.6 11.2C11.3 11.4 11 11.6 10.7 11.7L10.6 12.6C10.6 12.9 10.3 13.2 10 13.2H8.5C8.2 13.2 7.9 12.9 7.9 12.6L7.8 11.7C7.5 11.6 7.2 11.4 6.9 11.2L6 11.6C5.7 11.7 5.4 11.6 5.3 11.3L4.7 10.2C4.6 9.9 4.7 9.6 5 9.5L5.8 9.3C5.9 8.9 6 8.5 6 8C6 7.5 5.9 7.1 5.8 6.7L5 6.5C4.7 6.4 4.6 6.1 4.7 5.8L5.3 4.7C5.4 4.4 5.7 4.3 6 4.4L6.9 4.8C7.2 4.6 7.5 4.4 7.8 4.3L7.9 3.4C7.9 3.1 8.2 2.8 8.5 2.8H10C10.3 2.8 10.6 3.1 10.6 3.4L10.7 4.3C11 4.4 11.3 4.6 11.6 4.8L12.5 4.4C12.8 4.3 13.1 4.4 13.2 4.7L13.8 5.8C13.9 6.1 13.8 6.4 13.5 6.5L12.7 6.7C12.6 7.1 12.5 7.5 12.5 8Z" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
        <button id="auto-refresh-btn" class="action-btn" title="Auto Refresh Settings">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 8C2 10.2091 3.79086 12 6 12C7.10457 12 8.08024 11.4456 8.70711 10.7071M14 8C14 5.79086 12.2091 4 10 4C8.89543 4 7.91976 4.55439 7.29289 5.29289M7.29289 5.29289L10 8M7.29289 5.29289L5.29289 3.29289M8.70711 10.7071L11 8M8.70711 10.7071L10.7071 12.7071" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
          </svg>
        </button>
        <button id="devtools-btn" class="action-btn" title="Developer Tools">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 2L2 6V14C2 14.5523 2.44772 15 3 15H13C13.5523 15 14 14.5523 14 14V6L10 2H6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6 2V6H10V2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 9H11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M5 11H9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>



    <!-- Error Message -->
    <div id="error-message" class="error-message hidden">
      <span id="error-text"></span>
      <button id="error-close" class="error-close">×</button>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      <!-- File Explorer Sidebar -->
      <div id="file-explorer" class="file-explorer hidden">
        <div class="explorer-header">
          <h3>File Explorer</h3>
          <button id="explorer-close-btn" class="explorer-close-btn" title="Close Explorer">×</button>
        </div>
        <div class="explorer-toolbar">
          <button id="explorer-home-btn" class="explorer-btn" title="Home">🏠</button>
          <button id="explorer-up-btn" class="explorer-btn" title="Up">↑</button>
          <button id="explorer-refresh-btn" class="explorer-btn" title="Refresh">↻</button>
        </div>
        <div class="explorer-path">
          <input type="text" id="explorer-path-input" class="explorer-path-input" placeholder="Enter path..." />
        </div>
        <div id="explorer-content" class="explorer-content">
          <div class="explorer-loading">Loading...</div>
        </div>
      </div>

      <!-- Browser View Container -->
      <div class="browser-view-container">
        <!-- Loading Indicator -->
        <div id="loading-indicator" class="loading-indicator hidden">
          <div class="spinner"></div>
        </div>
      </div>
          <!-- Auto Refresh Settings Modal -->
      <div id="auto-refresh-modal" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header">
            <h3>Auto Refresh Settings</h3>
            <button id="auto-refresh-close-btn" class="modal-close-btn">×</button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label>
                <input type="checkbox" id="auto-refresh-enabled" />
                Enable Auto Refresh
              </label>
            </div>
            <div class="form-group">
              <label for="auto-refresh-interval">Refresh Interval (seconds)</label>
              <input type="number" id="auto-refresh-interval" min="1" max="3600" value="600" />
              <small>Minimum: 1 second, Maximum: 3600 seconds (1 hour)</small>
            </div>
            <div id="auto-refresh-status" class="auto-refresh-status"></div>
          </div>
          <div class="modal-footer">
            <button id="auto-refresh-cancel-btn" class="btn btn-secondary">Cancel</button>
            <button id="auto-refresh-save-btn" class="btn btn-primary">Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="file-explorer.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
